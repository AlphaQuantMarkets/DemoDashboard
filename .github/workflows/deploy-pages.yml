name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - minh-deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only browser assets. backend/ is deliberately excluded: GitHub
      # Pages cannot run Express, and this prevents any local .env file from
      # being packaged into the public artifact.
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R frontend ai-tutor _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
